# MySQL Profile Configuration (Activate via: mvn spring-boot:run -Dspring-boot.run.profiles=mysql)
spring.datasource.url=${SPRING_DATASOURCE_MYSQL_URL:jdbc:mysql://localhost:3306/skillmentor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
