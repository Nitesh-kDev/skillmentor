server.port=${PORT:8080}

spring.application.name=skillmentor-backend

# Import environment properties from local .env file
spring.config.import=optional:file:./.env[.properties]

# Database Configuration (Supports Aiven Cloud MySQL and Local H2 Fallback)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/skillmentor_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# HikariCP Connection Pool (Optimized for cloud databases like Aiven MySQL)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Configuration (Hibernate 6 auto-detects MySQLDialect or H2Dialect)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

# H2 Console (available at /h2-console when running locally)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Application Seeding (Creates initial demo users/skills if DB is empty)
app.seed.enabled=${APP_SEED_ENABLED:true}

# Security / JWT Configuration (Environment Provided)
jwt.secret=${JWT_SECRET:replace-with-a-long-random-secret}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:86400000}
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Razorpay Credentials (Environment Provided)
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}


# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./uploads

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
